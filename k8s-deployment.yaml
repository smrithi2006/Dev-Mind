apiVersion: apps/v1
kind: Deployment
metadata:
  name: devmind-deployment
  labels:
    app: devmind
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devmind
  template:
    metadata:
      labels:
        app: devmind
    spec:
      containers:
      - name: devmind-app
        image: devmind-backend:v1.0
        imagePullPolicy: Never
        workingDir: /app
        command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: devmind-service
spec:
  type: NodePort
  selector:
    app: devmind
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
